name: Decode Guide Preview Assets

on:
  push:
    branches:
      - agent/guides-damp-preview
    paths:
      - 'public/assets/guides/damp-moisture/*.webp.b64'
      - '.github/workflows/decode-guide-preview-assets.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/guides-damp-preview
          fetch-depth: 0
      - name: Decode and validate WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re, sys

          root = Path('public/assets/guides/damp-moisture')
          sources = sorted(root.glob('*.webp.b64'))
          if not sources:
              raise SystemExit('No .webp.b64 sources found')

          for source in sources:
              raw = source.read_text(errors='ignore')
              clean = ''.join(re.findall(r'[A-Za-z0-9+/=]', raw))
              clean = clean.rstrip('=')
              clean += '=' * ((4 - len(clean) % 4) % 4)
              try:
                  data = base64.b64decode(clean, validate=False)
              except Exception as exc:
                  raise SystemExit(f'Cannot decode {source.name}: {exc}')
              if len(data) < 16 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{source.name} is not a valid WebP payload')
              target = source.with_suffix('')
              target.write_bytes(data)
              print(f'{source.name} -> {target.name} ({len(data)} bytes)')
          PY
      - name: Commit decoded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ecovivamallorca-coder"
          git config user.email "ecovivamallorca@gmail.com"
          git add public/assets/guides/damp-moisture/*.webp
          if git diff --cached --quiet; then
            echo "No decoded asset changes."
            exit 0
          fi
          git commit -m "Decode damp guide WebP assets"
          git push origin HEAD:agent/guides-damp-preview
