<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Grid-connected solar with optional AC-coupled storage</title><desc id="desc">Photovoltaic panels 1 send direct current to inverter 2. Alternating current goes to distribution 3, household 4 and grid 5. Optional battery 6 exchanges alternating current with distribution.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#3e6b20"/></marker><linearGradient id="module" x2="1" y2="1"><stop stop-color="#15232e"/><stop offset="1" stop-color="#3f4951"/></linearGradient><style>.line{stroke:#3e6b20;stroke-width:3;fill:none}.n{font:700 17px Arial;fill:white;text-anchor:middle}.body{fill:#f6f7f3;stroke:#ccd5c7;stroke-width:1.5}.detail{stroke:#919d89;stroke-width:2;fill:none}.small{font:700 13px Arial;fill:#31551a}</style></defs><rect width="1200" height="430" rx="14" fill="#f4f6f0"/><path d="M196 139H290M430 139H523M663 139H740V75H822M740 139H822V205" class="line" marker-end="url(#arrow)"/><path d="M822 205H740" class="line" marker-end="url(#arrow)"/><path d="M593 211V285H740" class="line" stroke-dasharray="7 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="233" y="127" class="small">DC</text><text x="463" y="127" class="small">AC</text><text x="660" y="272" class="small">AC</text><g transform="translate(46 70)"><rect width="150" height="138" rx="9" class="body"/><path d="M20 85L37 29H128L112 85Z" fill="url(#module)" stroke="#11111f" stroke-width="2"/><path d="M29 54H120M61 29L46 85M93 29L78 85" stroke="#8a959d" stroke-width=".8"/><path d="M20 89V110M112 89V110M20 110H112" class="detail"/></g><g transform="translate(290 70)"><rect width="140" height="138" rx="9" class="body"/><rect x="34" y="20" width="72" height="98" rx="11" fill="white" stroke="#7b8873" stroke-width="2"/><rect x="54" y="36" width="34" height